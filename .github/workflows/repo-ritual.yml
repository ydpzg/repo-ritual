name: repo-ritual

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repo-ritual
        run: python -m pip install .
      - name: Run strict audit
        id: audit
        continue-on-error: true
        run: repo-ritual . --strict --markdown > repo-ritual-report.md
      - name: Comment report on pull request
        uses: actions/github-script@v7
        env:
          REPORT_PATH: repo-ritual-report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- repo-ritual-report -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Enforce strict audit
        if: steps.audit.outcome == 'failure'
        run: exit 1
