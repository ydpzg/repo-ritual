[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ritual"
version = "0.1.0"
description = "A zero-dependency repository health check and onboarding brief."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "dukelight"}]
keywords = ["developer-tools", "repository", "codebase", "onboarding", "cli", "health-check"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.scripts]
repo-ritual = "repo_ritual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
